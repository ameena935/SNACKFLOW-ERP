services:
  postgres:
    image: postgres:16-alpine
    container_name: snack_erp_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp123
      POSTGRES_DB: snack_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d snack_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
